name: SEC-04 isolated bcrypt Worker

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_deploy:
        description: "Type DEPLOY-ISOLATED-BCRYPT to authorize deployment of the isolated benchmark Worker only"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sec04-isolated-bcrypt
  cancel-in-progress: false

jobs:
  deploy-isolated-worker:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/final-audit') && inputs.confirm_isolated_deploy == 'DEPLOY-ISOLATED-BCRYPT'
    runs-on: ubuntu-latest
    environment: sec04-benchmark
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Validate isolated deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BENCHMARK_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
          CLOUDFLARE_ACCOUNT_SUBDOMAIN: ${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN in sec04-benchmark environment"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in sec04-benchmark environment"; exit 1; }
          test "${#BENCHMARK_TOKEN}" -ge 32 || { echo "::error::BENCHMARK_TOKEN must be at least 32 characters"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_SUBDOMAIN" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_SUBDOMAIN in sec04-benchmark environment"; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; const s=fs.readFileSync('benchmarks/bcrypt/wrangler.jsonc','utf8'); if(!s.includes('"name": "buaa-hep-bcrypt-benchmark"')||!s.includes('"main": "worker.mjs"'))process.exit(1)"
      - name: Deploy only the isolated benchmark Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config benchmarks/bcrypt/wrangler.jsonc
      - name: Set isolated benchmark token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BENCHMARK_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
        run: printf '%s' "$BENCHMARK_TOKEN" | npx wrangler secret put BENCHMARK_TOKEN --config benchmarks/bcrypt/wrangler.jsonc
      - name: Verify anonymous rejection and valid-token positive control
        env:
          BENCHMARK_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
          CLOUDFLARE_ACCOUNT_SUBDOMAIN: ${{ vars.CLOUDFLARE_ACCOUNT_SUBDOMAIN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = `https://buaa-hep-bcrypt-benchmark.${process.env.CLOUDFLARE_ACCOUNT_SUBDOMAIN}.workers.dev/benchmark`;
          const headers = { 'content-type': 'application/json' };

          const anonymous = await fetch(`${endpoint}?sample=unauth-check`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ cost: 6, bytes: 12, operation: 'control' }),
          });
          if (anonymous.status !== 404) {
            console.error(`Anonymous POST returned HTTP ${anonymous.status}; expected 404.`);
            process.exit(1);
          }

          const token = process.env.BENCHMARK_TOKEN;
          if (typeof token !== 'string' || token.length < 32) {
            console.error('BENCHMARK_TOKEN is missing or too short.');
            process.exit(1);
          }
          const authenticated = await fetch(`${endpoint}?sample=auth-check`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ cost: 6, bytes: 12, operation: 'control', token }),
          });
          if (authenticated.status !== 200) {
            console.error(`Valid-token POST returned HTTP ${authenticated.status}; expected 200.`);
            process.exit(1);
          }
          let result;
          try { result = await authenticated.json(); } catch {
            console.error('Valid-token POST returned non-JSON content.');
            process.exit(1);
          }
          const expected = {
            benchmark: 'bcrypt-v1',
            sampleId: 'auth-check',
            cost: 6,
            bytes: 12,
            operation: 'control',
            ok: true,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (result[key] !== value) {
              console.error(`Valid-token response field mismatch: ${key}.`);
              process.exit(1);
            }
          }
          if (authenticated.headers.get('cache-control') !== 'no-store') {
            console.error('Valid-token response is missing Cache-Control: no-store.');
            process.exit(1);
          }
          console.log('Anonymous POST: 404; valid-token control POST: 200; response contract verified.');
          NODE
