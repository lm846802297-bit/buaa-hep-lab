name: SEC-04 bcrypt local benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - frontend/benchmarks/bcrypt/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/functions/api/routes/auth.ts
      - .github/workflows/sec04-bcrypt-benchmark.yml
  push:
    branches:
      - main
    paths:
      - frontend/benchmarks/bcrypt/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/functions/api/routes/auth.ts
      - .github/workflows/sec04-bcrypt-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec04-bcrypt-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Reproducible bcrypt benchmark on Node (local evidence only)
        run: node frontend/benchmarks/bcrypt/run.mjs --runtime node --samples 50 --warmup 5 --out benchmark-results/node.json
      - name: Reproducible bcrypt benchmark on workerd (local evidence only)
        run: node frontend/benchmarks/bcrypt/run.mjs --runtime workerd --samples 50 --warmup 5 --out benchmark-results/workerd.json
      - name: Retain benchmark samples and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcrypt-local-evidence
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 90
