name: Validate and deploy BUAA HEP Hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buaa-hep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Frontend and API security regression tests
        run: npm --prefix frontend test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local backend security regressions
        env:
          LABHUB_SECRET_KEY: isolated-ci-test-secret-never-for-production-32-plus
          LABHUB_DB_PATH: /tmp/buaa-hep-ci.db
          SEED_DEMO_DATA: '0'
        run: |
          pip install -r backend/requirements-test.txt
          python -m pytest backend/test_security_regressions.py backend/test_optional_registration.py backend/test_system_setup.py -q
      - run: npm --prefix frontend run build
      - name: Public entry budget and prerender verification
        run: npm --prefix frontend run check:bundle
      - name: Install browser for route and layout smoke checks
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser smoke checks
        run: node frontend/tests/audit-browser-smoke.mjs
      - name: Isolated Pages runtime security smoke checks
        run: node scripts/verify-cloudflare.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: frontend/dist
          include-hidden-files: true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: frontend/dist
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Validation completed; deployment is not configured. Add both Cloudflare repository secrets to enable automatic publishing.'
            echo 'Validation passed. No deployment performed: Cloudflare repository secrets are missing.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy verified build
        if: steps.credentials.outputs.ready == 'true'
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run pages:deploy
      - name: Published site health and authorization checks
        if: steps.credentials.outputs.ready == 'true'
        run: node scripts/verify-live.mjs https://buaa-hep-hub.pages.dev
