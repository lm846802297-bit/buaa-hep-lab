name: Validate and deploy BUAA HEP Hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy the verified main build to production'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Cancel obsolete PR runs, but never cancel an active main release.
concurrency:
  group: buaa-hep-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_tests: ${{ steps.scope.outputs.frontend_tests }}
      backend_tests: ${{ steps.scope.outputs.backend_tests }}
      learning: ${{ steps.scope.outputs.learning }}
      cloudflare: ${{ steps.scope.outputs.cloudflare }}
      build: ${{ steps.scope.outputs.build }}
      browser: ${{ steps.scope.outputs.browser }}
      pages_deploy: ${{ steps.scope.outputs.pages_deploy }}
      release_config: ${{ steps.scope.outputs.release_config }}
      need_node: ${{ steps.scope.outputs.need_node }}
      need_python: ${{ steps.scope.outputs.need_python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            BASE_SHA="$(git rev-parse "${TARGET_SHA}^" 2>/dev/null || echo "$TARGET_SHA")"
          fi
          if [[ "$BASE_SHA" == "$TARGET_SHA" ]]; then
            files=""
          else
            files="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")"
          fi

          printf 'Changed paths:\n%s\n' "$files" >> "$GITHUB_STEP_SUMMARY"
          frontend=0; backend=0; learning=0; cloudflare=0; build=0; browser=0; pages_deploy=0; release_config=0; full=0

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              frontend/*) frontend=1 ;;
            esac
            case "$file" in
              backend/*) backend=1 ;;
            esac
            case "$file" in
              frontend/public/learning/*|frontend/src/content/learning.js) learning=1 ;;
            esac
            case "$file" in
              frontend/functions/*|frontend/wrangler.json|frontend/package.json|frontend/package-lock.json|scripts/schema_d1.sql|scripts/verify-cloudflare.mjs|.github/workflows/deploy.yml)
                cloudflare=1 ;;
            esac
            case "$file" in
              frontend/src/*|frontend/public/*|frontend/index.html|frontend/package.json|frontend/package-lock.json|frontend/vite.config.*|frontend/scripts/*|.github/workflows/deploy.yml)
                case "$file" in *.test.*|*.spec.*) ;; *) build=1 ;; esac ;;
            esac
            case "$file" in
              frontend/src/*|frontend/public/*|frontend/index.html|frontend/package.json|frontend/package-lock.json|frontend/vite.config.*|frontend/scripts/*|frontend/functions/*|frontend/wrangler.json|scripts/schema_d1.sql)
                case "$file" in *.test.*|*.spec.*) ;; *) pages_deploy=1 ;; esac ;;
            esac
            case "$file" in
              .github/workflows/deploy.yml) release_config=1 ;;
            esac
            case "$file" in
              frontend/src/App.vue|frontend/src/index.css|frontend/src/router/*|frontend/index.html|frontend/src/composables/useThemeStyle.js|frontend/src/views/StyleView.vue|frontend/src/views/PublicHomeView.vue|frontend/src/views/ResearchTopicView.vue|frontend/src/components/PublicThemeSwitcher.vue|frontend/src/components/WorldlineEffects.vue|frontend/src/components/ForecastAtmosphere.vue|frontend/tests/audit-browser-smoke.mjs)
                browser=1 ;;
            esac
            case "$file" in
              backend/auth.py|backend/models.py|backend/database.py|frontend/functions/api/routes/auth.ts|frontend/functions/api/routes/files.ts|frontend/functions/api/routes/notices.ts|scripts/schema_d1.sql|frontend/wrangler.json)
                full=1 ;;
            esac
          done <<< "$files"

          frontend_tests="$frontend"
          backend_tests="$backend"
          if [[ "$full" == 1 ]]; then
            frontend_tests=1
            backend_tests=1
            cloudflare=1
            build=1
          fi
          if [[ "$browser" == 1 || "$pages_deploy" == 1 ]]; then build=1; fi

          need_node=0
          if [[ "$frontend_tests" == 1 || "$build" == 1 || "$cloudflare" == 1 ]]; then need_node=1; fi
          need_python=0
          if [[ "$backend_tests" == 1 || "$learning" == 1 ]]; then need_python=1; fi

          for key in frontend_tests backend_tests learning cloudflare build browser pages_deploy release_config need_node need_python; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_OUTPUT"
          done

  validate:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.need_node == '1' || needs.changes.outputs.need_python == '1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.need_node == '1'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: needs.changes.outputs.need_node == '1'
        run: npm --prefix frontend ci
      - name: Frontend and API tests
        if: needs.changes.outputs.frontend_tests == '1'
        run: npm --prefix frontend test
      - name: Build and check public pages
        if: needs.changes.outputs.build == '1'
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run check:bundle
      - name: Upload verified release artifact
        if: needs.changes.outputs.build == '1'
        uses: actions/upload-artifact@v4
        with:
          name: verified-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.need_python == '1'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: FastAPI regression tests
        if: needs.changes.outputs.backend_tests == '1'
        env:
          LABHUB_SECRET_KEY: isolated-ci-test-secret-never-for-production-32-plus
          LABHUB_DB_PATH: /tmp/buaa-hep-ci.db
          SEED_DEMO_DATA: '1'
        run: |
          pip install -r backend/requirements-test.txt
          python -m pytest backend -q
      - name: Teaching benchmark check
        if: needs.changes.outputs.learning == '1'
        run: python frontend/public/learning/two_body_decay.py
      - name: Install Chromium for high-impact UI changes
        if: needs.changes.outputs.browser == '1'
        timeout-minutes: 5
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser smoke checks
        if: needs.changes.outputs.browser == '1'
        run: node frontend/tests/audit-browser-smoke.mjs
      - name: Upload browser evidence on failure
        if: failure() && needs.changes.outputs.browser == '1'
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-evidence
          path: frontend/test-results/audit/
          if-no-files-found: warn
          retention-days: 7
      - name: Isolated Cloudflare security checks
        if: needs.changes.outputs.cloudflare == '1'
        run: node scripts/verify-cloudflare.mjs

  release:
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.pages_deploy == '1' || needs.changes.outputs.release_config == '1')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Require a merged PR with successful PR CI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
        uses: actions/github-script@v7
        id: release_context
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: sha,
            });
            const pr = associated.find((item) =>
              item.base?.ref === 'main' &&
              item.merged_at &&
              item.merge_commit_sha === sha
            );
            if (!pr) {
              core.setFailed(`Refusing release ${sha}: it is not the merge commit of a merged PR targeting main.`);
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'deploy.yml', head_sha: pr.head.sha,
              event: 'pull_request', per_page: 100,
            });
            const runs = data.workflow_runs
              .filter((run) => run.head_sha === pr.head.sha && run.event === 'pull_request')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            if (!runs.length || runs[0].conclusion !== 'success') {
              core.setFailed(`Refusing release: PR #${pr.number} has no successful validation run for exact head ${pr.head.sha}.`);
              return;
            }
            const { data: prCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: pr.head.sha });
            const { data: mergedCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: sha });
            const treeMatches = prCommit.tree.sha === mergedCommit.tree.sha;
            core.setOutput('pr_run_id', String(runs[0].id));
            core.setOutput('pr_head_sha', pr.head.sha);
            core.setOutput('reuse_artifact', treeMatches ? 'true' : 'false');
            if (treeMatches) {
              core.info(`Release authorized by merged PR #${pr.number}; exact-head CI run #${runs[0].run_number} passed and the Git trees match. Reusing the validated artifact.`);
            } else {
              core.warning(`Merged tree differs from validated PR tree (${mergedCommit.tree.sha} vs ${prCommit.tree.sha}); artifact reuse is disabled and the merged tree must be revalidated before release.`);
            }
      - name: Download exact PR-validated build artifact
        if: github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && steps.release_context.outputs.reuse_artifact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-frontend-dist
          path: frontend/dist
          run-id: ${{ steps.release_context.outputs.pr_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production || needs.changes.outputs.release_config == '1' || github.event_name == 'push' && (needs.changes.outputs.pages_deploy != '1' || steps.release_context.outputs.reuse_artifact != 'true')
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install release dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production || needs.changes.outputs.release_config == '1' || github.event_name == 'push' && (needs.changes.outputs.pages_deploy != '1' || steps.release_context.outputs.reuse_artifact != 'true')
        run: npm --prefix frontend ci
      - name: Revalidate frontend on merged tree when artifact reuse is unsafe
        if: github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && steps.release_context.outputs.reuse_artifact != 'true' && needs.changes.outputs.frontend_tests == '1'
        run: npm --prefix frontend test
      - name: Build release when no exact PR artifact can be reused
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production || needs.changes.outputs.release_config == '1' || github.event_name == 'push' && (needs.changes.outputs.pages_deploy != '1' || steps.release_context.outputs.reuse_artifact != 'true')
        run: npm --prefix frontend run build
      - name: Check public pages and initial dependencies
        run: npm --prefix frontend run check:bundle
      - uses: actions/setup-python@v5
        if: github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && steps.release_context.outputs.reuse_artifact != 'true' && (needs.changes.outputs.backend_tests == '1' || needs.changes.outputs.learning == '1')
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Revalidate FastAPI on changed merged tree
        if: github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && steps.release_context.outputs.reuse_artifact != 'true' && needs.changes.outputs.backend_tests == '1'
        env:
          LABHUB_SECRET_KEY: isolated-ci-test-secret-never-for-production-32-plus
          LABHUB_DB_PATH: /tmp/buaa-hep-release-ci.db
          SEED_DEMO_DATA: '1'
        run: |
          pip install -r backend/requirements-test.txt
          python -m pytest backend -q
      - name: Revalidate teaching benchmark on changed merged tree
        if: github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && steps.release_context.outputs.reuse_artifact != 'true' && needs.changes.outputs.learning == '1'
        run: python frontend/public/learning/two_body_decay.py
      - name: Revalidate Chromium smoke on changed merged tree
        if: github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && steps.release_context.outputs.reuse_artifact != 'true' && needs.changes.outputs.browser == '1'
        run: |
          npx --prefix frontend playwright install --with-deps chromium
          node frontend/tests/audit-browser-smoke.mjs
      - name: Isolated Cloudflare check when release tree needs revalidation
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy_production) || (github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && steps.release_context.outputs.reuse_artifact != 'true' && needs.changes.outputs.cloudflare == '1')
        run: node scripts/verify-cloudflare.mjs
      - name: Isolated Cloudflare check for manual releases
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
        run: node scripts/verify-cloudflare.mjs
      - name: Check deployment credentials
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy_production) || (github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && !contains(github.event.head_commit.message, '[skip-prod-deploy]'))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Publication blocked: required Cloudflare credentials are missing.'
            exit 1
          fi
      - name: Deploy verified build
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy_production) || (github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && !contains(github.event.head_commit.message, '[skip-prod-deploy]'))
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run pages:deploy
      - name: Published site health and authorization checks
        if: (github.event_name == 'workflow_dispatch' && inputs.deploy_production) || (github.event_name == 'push' && needs.changes.outputs.pages_deploy == '1' && !contains(github.event.head_commit.message, '[skip-prod-deploy]'))
        run: node scripts/verify-live.mjs https://buaa-hep-hub.pages.dev
