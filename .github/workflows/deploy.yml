name: Validate and deploy BUAA HEP Hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# New commits supersede old validation runs for the same PR.
# Main/deployment runs are never cancelled by this setting.
concurrency:
  group: buaa-hep-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Frontend and API security regression tests
        run: npm --prefix frontend test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full FastAPI backend regression suite
        env:
          LABHUB_SECRET_KEY: isolated-ci-test-secret-never-for-production-32-plus
          LABHUB_DB_PATH: /tmp/buaa-hep-ci.db
          SEED_DEMO_DATA: '0'
        run: |
          pip install -r backend/requirements-test.txt
          python -m pytest backend -q
      - name: Teaching benchmark consistency checks
        run: python frontend/public/learning/two_body_decay.py
      - run: npm --prefix frontend run build
      - name: Public entry budget and prerender verification
        run: npm --prefix frontend run check:bundle
      - name: Install browser for route and layout smoke checks
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser smoke checks
        run: node frontend/tests/audit-browser-smoke.mjs
      - name: Upload Chromium audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-evidence
          path: frontend/test-results/audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Isolated Pages runtime security smoke checks
        run: node scripts/verify-cloudflare.mjs
      - name: Validate isolated bcrypt Worker bundle without deployment
        working-directory: frontend
        run: npx wrangler deploy --dry-run --outdir /tmp/buaa-hep-bcrypt-bundle --config benchmarks/bcrypt/wrangler.jsonc
      - name: Reproducible bcrypt benchmark (local evidence only)
        run: |
          node frontend/benchmarks/bcrypt/run.mjs --runtime node --samples 50 --warmup 5 --out benchmark-results/node.json
          node frontend/benchmarks/bcrypt/run.mjs --runtime workerd --samples 50 --warmup 5 --out benchmark-results/workerd.json
      - name: Retain benchmark samples and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcrypt-local-evidence
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: frontend/dist
          include-hidden-files: true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: frontend/dist
      - name: Require a merged pull request for production release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: sha,
            });
            const authorized = pullRequests.find((pr) =>
              pr.base?.ref === 'main' &&
              pr.merged_at &&
              pr.merge_commit_sha === sha
            );
            if (!authorized) {
              core.setFailed(`Refusing production deployment for ${sha}: it is not the merge commit of a merged PR targeting main.`);
            } else {
              core.info(`Production release authorized by merged PR #${authorized.number}.`);
            }
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Publication blocked: one or more required Cloudflare credentials are missing. Review docs/RELEASE_AUTHORITY.md.'
            echo 'Deployment was requested by a main-branch workflow, but required Cloudflare credentials are missing. No deployment performed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Deploy verified build
        if: steps.credentials.outputs.ready == 'true'
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run pages:deploy -- --commit-hash="${{ github.sha }}" --commit-dirty=false
      - name: Published site health and authorization checks
        if: steps.credentials.outputs.ready == 'true'
        run: node scripts/verify-live.mjs https://buaa-hep-hub.pages.dev
