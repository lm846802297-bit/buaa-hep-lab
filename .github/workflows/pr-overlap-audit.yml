name: Pull request overlap audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  overlap-audit:
    name: Report shared-file changes
    runs-on: ubuntu-latest
    steps:
      - name: Compare changed paths with other open pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const current = context.payload.pull_request;

            if (!current) {
              core.setFailed('This workflow requires a pull_request event.');
              return;
            }

            const currentFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: current.number, per_page: 100 }
            );
            const currentPaths = new Set(currentFiles.map((file) => file.filename));

            const openPullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                base: current.base.ref,
                per_page: 100,
              }
            );

            const overlaps = [];
            for (const other of openPullRequests) {
              if (other.number === current.number) continue;

              const otherFiles = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: other.number, per_page: 100 }
              );
              const sharedPaths = otherFiles
                .map((file) => file.filename)
                .filter((path) => currentPaths.has(path))
                .sort();

              if (sharedPaths.length > 0) {
                overlaps.push({ pullRequest: other, paths: sharedPaths });
              }
            }

            overlaps.sort((a, b) => a.pullRequest.number - b.pullRequest.number);

            const escapeTable = (value) =>
              String(value).replace(/\|/g, '\\|').replace(/[\r\n]+/g, ' ');

            await core.summary
              .addHeading('Pull request file-overlap audit')
              .addRaw(`Audited PR #${current.number} (${current.head.sha.slice(0, 12)}) against ${openPullRequests.length - 1} other open PR(s) targeting \`${current.base.ref}\`.`)
              .addEOL();

            if (overlaps.length === 0) {
              await core.summary
                .addHeading('No shared file paths detected', 2)
                .addRaw('No other currently open PR targeting the same base branch changes the exact same paths as this PR. This does not rule out logical dependencies or runtime conflicts.')
                .addEOL();
              core.info('No exact changed-file overlaps found.');
            } else {
              await core.summary
                .addHeading(`${overlaps.length} PR(s) share changed file paths`, 2)
                .addRaw('This is a coordination warning, not a merge blocker. Confirm ownership and merge order before integrating overlapping changes.')
                .addEOL()
                .addTable([
                  [
                    { data: 'Other PR', header: true },
                    { data: 'Title', header: true },
                    { data: 'Shared paths', header: true },
                  ],
                  ...overlaps.map(({ pullRequest, paths }) => [
                    `[#${pullRequest.number}](${pullRequest.html_url})`,
                    escapeTable(pullRequest.title),
                    paths.map((path) => `\`${escapeTable(path)}\``).join('<br>'),
                  ]),
                ]);
              core.warning(`Found shared file paths with ${overlaps.length} other open PR(s). Review the workflow summary before merging.`);
            }

            await core.summary
              .addEOL()
              .addRaw('Scope: exact file-path overlap only. This check does not infer API dependencies, semantic conflicts, branch freshness, test results, or mergeability.')
              .write();
