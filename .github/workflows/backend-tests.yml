name: FastAPI Backend Regression Suite

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/schema_d1.sql"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/schema_d1.sql"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: buaa-hep-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The FastAPI SPA-serving test checks frontend/dist, so build it before
      # importing backend.main during pytest collection.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-test.txt
      - name: Run the complete FastAPI backend test suite
        env:
          LABHUB_SECRET_KEY: isolated-ci-test-secret-never-for-production-32-plus
          LABHUB_DB_PATH: /tmp/buaa-hep-backend-ci.db
          SEED_DEMO_DATA: "1"
        run: python -m pytest backend -q
