<circle cx="67" cy="-85" r="27" fill="url(#state)"/><circle cx="67" cy="-85" r="5" fill="#fff5d7"/>
<path d="M0 0L-72 82" stroke="#8fa9ff" stroke-width="2" stroke-dasharray="5 6"/><circle cx="-72" cy="82" r="4" fill="#8fa9ff"/>
