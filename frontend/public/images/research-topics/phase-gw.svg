<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">宇宙相变泡成核、碰撞与引力波</title><desc id="desc">不同尺度的圆形区域示意真空泡成核、扩张与碰撞；背景网格和右侧波形仅作时空扰动及引力波信号的概念表达。图中不包含特定相变参数、定量频谱或对泡壁碰撞、声波、湍流等源贡献的计算。</desc>
