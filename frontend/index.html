<!DOCTYPE html>
<html lang="zh-CN" style="background-color: #F7F5F0;">
  <head>
    <meta charset="UTF-8" />
    <!-- Single Page Apps for GitHub Pages: 恢复 404.html 重定向路径 -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script>
      (function() {
        try {
          var siteBase = '%BASE_URL%'.replace(/\/$/, '');
          var normalizedPath = window.location.pathname.length > 1
            ? window.location.pathname.replace(/\/+$/, '')
            : window.location.pathname;
          var routePath = normalizedPath;
          if (siteBase && (normalizedPath === siteBase || normalizedPath.startsWith(siteBase + '/'))) {
            routePath = normalizedPath.slice(siteBase.length) || '/';
          }
          if (!routePath.startsWith('/')) routePath = '/' + routePath;
          var isPublicRoute = routePath === '/' || routePath === '/people' || routePath === '/events' || routePath.startsWith('/research/');

          // Match the live theme module's storage namespace, with a read-only
          // fallback for preferences written by older builds.
          var savedScheme = localStorage.getItem('laborbit_color_scheme') || localStorage.getItem('labhub_color_scheme');
          var savedBg = localStorage.getItem('laborbit_bg_type') || localStorage.getItem('labhub_bg_type');
          var savedLegacy = localStorage.getItem('laborbit_theme_style') || localStorage.getItem('labhub_theme_style');
          var savedCustom = localStorage.getItem('laborbit_custom_color_scheme') || localStorage.getItem('labhub_custom_color_scheme');

          // Public-site palette is independent from the signed-in workspace palette.
          var savedPublicScheme = localStorage.getItem('labhub_public_color_scheme');
          var validPublicSchemes = ['quiet-research', 'classic-cyan', 'obsidian-gray', 'nebula-purple', 'worldline-console'];
          var publicScheme = validPublicSchemes.includes(savedPublicScheme) ? savedPublicScheme : 'quiet-research';
          // Public pages default to Quiet Research but may restore a visitor's own choice.
          var scheme = isPublicRoute ? publicScheme : (savedScheme || (
            savedLegacy === 'galaxy' ? 'nebula-purple' :
            savedLegacy === 'vanta-fog' || savedLegacy === 'clouds-static' || savedLegacy === 'earth-orbit'
              ? 'classic-cyan' : 'quiet-research'
          ));
          if (!['quiet-research', 'classic-cyan', 'obsidian-gray', 'nebula-purple', 'worldline-console', 'custom'].includes(scheme) ||
              (isPublicRoute && !validPublicSchemes.includes(scheme))) {
            scheme = 'quiet-research';
          }

          var legacyBg = ['galaxy', 'vanta-fog', 'clouds-static', 'earth-orbit', 'custom-local'].includes(savedLegacy)
            ? savedLegacy : 'paper';
          var bgType = isPublicRoute ? 'paper' : (
            ['paper', 'galaxy', 'vanta-fog', 'clouds-static', 'custom-local'].includes(savedBg)
              ? savedBg
              : (legacyBg === 'earth-orbit' ? 'clouds-static' : legacyBg)
          );
          if (!['paper', 'galaxy', 'vanta-fog', 'clouds-static', 'custom-local'].includes(bgType)) {
            bgType = 'paper';
          }

          var legacyStyle = scheme === 'worldline-console' ? 'worldline-console' :
            scheme === 'quiet-research' && bgType === 'paper' ? 'paper' :
            scheme === 'nebula-purple' ? 'galaxy' :
            scheme === 'custom' ? 'custom' :
            bgType === 'vanta-fog' ? 'vanta-fog' : 'clouds-static';
          var bgHex = scheme === 'quiet-research' ? '#F7F5F0' :
            scheme === 'worldline-console' ? '#100d08' :
            scheme === 'obsidian-gray' ? '#090d16' :
            scheme === 'nebula-purple' ? '#03020a' : '#081f28';
          var doc = document.documentElement;
          doc.dataset.publicPage = String(isPublicRoute);
          doc.setAttribute('data-color-scheme', scheme);
          doc.setAttribute('data-bg-type', bgType);
          doc.setAttribute('data-theme-style', legacyStyle);
          doc.setAttribute('data-bg-style', bgType);

          if (scheme === 'custom') {
            try {
              var c = savedCustom ? JSON.parse(savedCustom) : null;
              if (c) {
                if (c.baseColor) bgHex = c.baseColor;
                if (c.baseColor) doc.style.setProperty('--bg', c.baseColor);
                if (c.primaryColor) {
                  doc.style.setProperty('--accent', c.primaryColor);
                  doc.style.setProperty('--focus', c.primaryColor);
                }
                if (c.panelColor) doc.style.setProperty('--panel', c.panelColor);
                if (c.panelHex) doc.style.setProperty('--panel-solid', c.panelHex);
                if (c.surfaceColor) doc.style.setProperty('--surface', c.surfaceColor);
                if (c.lineColor) doc.style.setProperty('--line', c.lineColor);
                if (c.accentInk) doc.style.setProperty('--accent-ink', c.accentInk);
                if (c.accentStrong) doc.style.setProperty('--accent-strong', c.accentStrong);
                if (c.raised) doc.style.setProperty('--raised', c.raised);
                if (c.glass) doc.style.setProperty('--glass', c.glass);
              }
            } catch (err) {}
          }

          doc.style.backgroundColor = bgHex;
          var basePath = siteBase;
          if (bgType === 'clouds-static' && scheme !== 'quiet-research' && doc.dataset.publicPage !== 'true') {
            doc.style.backgroundImage = "url('" + basePath + "/assets/forecast/forecast-clouds-drift-seamless.jpg')";
            doc.style.backgroundPosition = 'center center';
            doc.style.backgroundSize = 'cover';
            doc.style.backgroundRepeat = 'no-repeat';
          } else {
            doc.style.backgroundImage = 'none';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="canonical" href="https://buaa-hep-hub.pages.dev/" />

    <meta property="og:description" content="北京航空航天大学粒子物理研究组：研究方向、代表成果与学术合作。课题组名称暂定。" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="北航粒子物理研究组（暂定）" />

    <title>北航粒子物理研究组（暂定） | 高能粒子物理唯象学</title>

    <style>
      :root {
        color-scheme: light;
      }
      html {
        background-color: #F7F5F0;
        min-height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: inherit;
        color: #292722;
        min-height: 100%;
      }
      html[data-bg-style="clouds-static"],
      html[data-bg-style="clouds-static"] body,
      html[data-bg-type="clouds-static"],
      html[data-bg-type="clouds-static"] body {
        background-color: #081f28;
        background-image: url('/assets/forecast/forecast-clouds-drift-seamless.jpg');
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      html[data-color-scheme="classic-cyan"],
      html[data-color-scheme="classic-cyan"] body,
      html[data-theme-style="vanta-fog"],
      html[data-theme-style="vanta-fog"] body {
        background-color: #081f28;
      }
      html[data-color-scheme="nebula-purple"],
      html[data-color-scheme="nebula-purple"] body,
      html[data-theme-style="galaxy"],
      html[data-theme-style="galaxy"] body {
        background-color: #03020a;
        background-image: none;
        color: #f8fafc;
      }
      html[data-color-scheme="quiet-research"], html[data-color-scheme="quiet-research"] body {
        color-scheme: light;
        background-color: #F7F5F0;
        background-image: none !important;
        color: #292722;
      }
      html[data-public-page="true"], html[data-public-page="true"] body {
        background-image: none !important;
      }
      #app {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: transparent;
      }
    </style>

    <!-- 优先使用系统原生高质量排版字体栈，避免外网字体请求阻塞页面渲染 -->
    <script>
      (function() {
        function hideWechatToolbar() {
          if (typeof WeixinJSBridge !== 'undefined' && WeixinJSBridge.call) {
            WeixinJSBridge.call('hideToolbar');
          }
        }
        if (typeof WeixinJSBridge === 'undefined') {
          document.addEventListener('WeixinJSBridgeReady', hideWechatToolbar, false);
        } else {
          hideWechatToolbar();
        }
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
