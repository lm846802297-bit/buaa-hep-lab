version: '3.8'

services:
  lab-hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lab-hub-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据库目录，容器重建或升级时数据不丢失
      - ./data:/app/data
    environment:
      LABHUB_INVITE_CODE: "${LABHUB_INVITE_CODE:?Set a unique LABHUB_INVITE_CODE before starting}"
      LABHUB_SECRET_KEY: "${LABHUB_SECRET_KEY:?Set a random LABHUB_SECRET_KEY of at least 32 characters}"
      # Required only when running the explicit clean-database bootstrap command.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD-}"
      LABHUB_DB_PATH: /app/data/labhub.db
